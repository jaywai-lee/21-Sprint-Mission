<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>판다마켓</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <header>
    <a href="/">
    <img class="pandamarket-logo" src="image/Property 1=md.png">
    </a>
    <a class="login-button" href="/login">로그인</a>
  </header>
  <div class="content">
    <div class="container">
      <div class="header-banner">
        <h1>
        일상의 모든 물건을<br>
        거래해 보세요
        </h1>
      <a class="header-banner-button" href="/items">구경하러 가기</a>
      </div>
    <div class="header-banner-img">
      <img class="header-image" src="image/Img_home_top.png">
    </div>
    </div>
   </div>
  <main>
    <div class="main-container">
      <img class="main-image" src="image/Img_home_01.png">
      <div class="description-1">
        <span class="badge-1">Hot item</span>
        <h1>
          인기 상품을<br>
          확인해 보세요
        </h1>
        <p class="description-content">
          가장 HOT한 중고거래 물품을<br>
          판다 마켓에서 확인해 보세요
        </p>
      </div>
    </div>    
  </main>
  <main>
    <div class="main-container">
      <div class="description-2">
      <span class="badge-2">Search</span>
      <h1>
        구매를 원하는<br>
        상품을 검색하세요
      </h1>
      <p>
        구매하고 싶은 물품은 검색해서<br>
        쉽게 찾아보세요
      </p>
      </div>
      <img class="main-image" src="image/Img_home_02.png">
    </div>
  </main>
  <main>
    <div class="main-container">
      <img class="main-image" src="image/Img_home_03.png">
      <div class="description-1">
        <span class="badge-3">Register</span>
        <h1>
          판매를 원하는<br>
          상품을 등록하세요
        </h1>
        <p class="description-content">
          어떤 물건이든 판매하고 싶은 상품을<br>
          쉽게 등록하세요
        </p>
      </div> 
    </div>
  </main>
  <footer>
    <div class="content">
      <div class="container">
        <h1 class="footer-title">
          믿을 수 있는<br>
          판다마켓 중고 거래
        </h1>
        <img class="footer-image" src="image/Img_home_bottom.png">
      </div>
    </div>
  </footer>
  <div class="footer-background">
  </div>

</body>

</html>
