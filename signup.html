<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓 회원가입</title>
  <link rel="icon" href="images/logo/favicon.ico">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./styles/login_signup.css">
</head>

  <body>
    <section class="login-page">
      <div class="login-logo">
        <a href="./index.html">
        <img src="./images/logo/panda-market-logo.png" alt=판다 로그인 로고 width="396">
        </a>
      </div>

      <div>
        <p class="input">이메일</p>
        <input type="email" placeholder="E-mail">
      </div>

      <div>
        <p class="input">닉네임</p>
        <input type="text" placeholder="Nickname">
      </div>

      <div class="input-password">
        <p class="input">비밀번호</p>
        <input type="password" placeholder="Password">
        <div class="eyes">
          <i class="fa fa-eye-slash fa-lg"></i>
        </div>
      </div>

      <div class="input-password">
        <p class="input">비밀번호 확인</p>
        <input type="text" placeholder="Password repeat">
        <div class="eyes">
          <i class="fa fa-eye fa-lg"></i>
        </div>
      </div>

      <div>
        <a href="./signup.html" class="login-button">회원가입</a>
      </div>

      <div class="quick-login">
        <p class="quick-login-content">간편 로그인하기</p>
        <div class="social">
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
          <img src="./images/social/Google-logo.png" alt="구글" width="42">
        </a>
        <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer">
          <img src="./images/social/kakaotalk-logo.png" alt="카카오" width="42">
        </a>
        </div>
      </div>

      <div class="footer">
        <p class="signup-request-description">이미 회원이신가요?</p>
        <a href="./login.html" class="signup-request">로그인</a>
      </div>
    </section>
  </body>
