<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 회원가입</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>

  <body>
    <section class="login-page">
      <div class="login-logo">
        <a href="./index.html">
          <img
            src="./images/logo/panda-market-logo.png"
            class="panda-logo"
            alt="판다"
            로그인
            로고
            width="396"
          />
        </a>
      </div>

      <form class="login-form" action="#" method="post">
        <div class="input-email">
          <label class="input">이메일</label>
          <input
            name="email"
            type="email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </div>

        <div class="input-nickname">
          <label class="input">닉네임</label>
          <input
            name="nickname"
            type="text"
            placeholder="닉네임을 입력해주세요"
            required
          />
        </div>

        <div class="input-password">
          <label class="input">비밀번호</label>
          <input
            name="password"
            type="password"
            placeholder="비밀번호를 입력해주세요"
            required
          />
          <button type="button" class="eyes" tabindex="-1">
            <i class="fa fa-eye-slash fa-lg"></i>
          </button>
          <div class="error-wrapper"></div>
        </div>

        <div class="input-password-repeat">
          <label class="input">비밀번호 확인</label>
          <input
            name="passwordConfirm"
            type="password"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
            required
          />
          <button type="button" class="eyes" tabindex="-1">
            <i class="fa fa-eye-slash fa-lg"></i>
          </button>
          <div class="error-wrapper"></div>
        </div>

        <div class="signup-button-wrap">
          <button type="submit" class="signup-button">회원가입</button>
        </div>
      </form>

      <div class="quick-login">
        <p class="quick-login-content">간편 로그인하기</p>
        <div class="social">
          <a
            href="https://www.google.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./images/social/Google-logo.png" alt="구글" width="42" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="./images/social/kakaotalk-logo.png"
              alt="카카오"
              width="42"
            />
          </a>
        </div>
      </div>

      <div class="footer">
        <p class="signup-request-description">이미 회원이신가요?</p>
        <a href="./login.html" class="signup-request">로그인</a>
      </div>
    </section>
    <script src="./features/auth.js"></script>
  </body>
</html>
